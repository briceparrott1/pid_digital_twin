services:
  neo4j:
    image: neo4j:5.18
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=${NEO4J_USER}/${NEO4J_PASSWORD}
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "${NEO4J_USER}", "-p", "${NEO4J_PASSWORD}", "RETURN 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  computer-vision:
    build: ./apps/computer_vision
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      - NEO4J_URI=bolt://neo4j:7687
    depends_on:
      neo4j:
        condition: service_healthy
    volumes:
      - ./apps/computer_vision/data:/app/data

  frontend:
    build: ./apps/frontend
    ports:
      - "5173:5173"
    depends_on:
      - computer-vision
    environment:
      - VITE_API_PROXY_TARGET=http://computer-vision:8000

volumes:
  neo4j_data: